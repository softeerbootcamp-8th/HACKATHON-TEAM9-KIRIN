# Reference copy only — this file is installed manually at
# /etc/nginx/conf.d/kirin.conf on kirin-server.
# It is NOT read or deployed by the CI/CD pipeline itself.
#
# Note: Amazon Linux 2023's stock nginx.conf ships its own default_server
# welcome block — remove/comment that out first, or nginx will refuse to
# reload with a "duplicate default server" error.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kirin-frontend/current;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20m;
}
