# Reference copy only — this file is installed manually at
# /etc/nginx/conf.d/kirin.conf on kirin-server.
# It is NOT read or deployed by the CI/CD pipeline itself.
#
# Note: Amazon Linux 2023's stock nginx.conf ships its own default_server
# welcome block — remove/comment that out first, or nginx will refuse to
# reload with a "duplicate default server" error.
#
# 2026-08-25: `certbot --nginx` was run for odagada.shop, which rewrote this
# file on the live server. Certbot moved the app server block to HTTPS-only
# (added `listen 443 ssl`, dropped its own `listen 80`) and generated a
# second server block that owns port 80: it 301s Host: odagada.shop /
# www.odagada.shop to https, and `return 404`s everything else (including a
# bare "curl http://127.0.0.1/" with no matching Host header — this broke
# the frontend CD smoke test, see frontend/deploy/deploy.sh's SITE_HOST /
# --resolve workaround). Keep this reference file in sync if the live config
# changes again — Certbot will happily rewrite it a second time without
# telling anyone.

server {
    server_name odagada.shop www.odagada.shop;

    root /var/www/kirin-frontend/current;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20m;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/odagada.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/odagada.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.odagada.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = odagada.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name odagada.shop www.odagada.shop;
    return 404; # managed by Certbot
}
