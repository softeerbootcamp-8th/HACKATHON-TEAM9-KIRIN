name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_call:
    inputs:
      upload-jar:
        required: false
        type: boolean
        default: false

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: kirin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p1234"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build and test
        run: ./gradlew clean build --no-daemon
      - name: Locate built jar
        id: locate-jar
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No runnable jar found in backend/build/libs"
            exit 1
          fi
          echo "jar-path=$JAR_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload jar artifact
        if: ${{ inputs.upload-jar }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/${{ steps.locate-jar.outputs.jar-path }}
          retention-days: 7
          if-no-files-found: error
