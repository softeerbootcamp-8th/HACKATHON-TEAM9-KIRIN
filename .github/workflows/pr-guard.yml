name: PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-base-branch:
    name: Verify PR base branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ALLOWED_BASES="develop main"
          {
            echo "## PR Guard"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Head branch | \`$HEAD_REF\` |"
            echo "| Base branch | \`$BASE_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          is_allowed=false
          for b in $ALLOWED_BASES; do
            if [ "$BASE_REF" = "$b" ]; then is_allowed=true; fi
          done
          if [ "$is_allowed" = "true" ]; then
            echo "| Result | allowed |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Result | NOT allowed |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PRs must target one of: $ALLOWED_BASES (got '$BASE_REF')"
            exit 1
          fi
