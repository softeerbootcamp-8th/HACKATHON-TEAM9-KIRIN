spring:
  application:
    name: superservice
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:kirin}
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 로그인 화면 없이 부팅 시 조용히 게스트 세션을 발급하는 구조라(SessionProvider),
# 세션이 끊기면 다음 방문 때 새 게스트로 취급돼 이전 등록 상품 등이 안 보이게 된다.
# 세션 만료·쿠키 유지 시간을 하루로 늘려 그 사이엔 같은 게스트로 계속 인식되게 한다.
server:
  servlet:
    session:
      timeout: 1d
      cookie:
        max-age: 1d

async:
  slack-notification:
    core-pool-size: ${ASYNC_SLACK_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_SLACK_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_SLACK_QUEUE_CAPACITY:20}

slack:
  enabled: ${SLACK_ENABLED:false}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel: ${SLACK_CHANNEL:}

toss:
  payment:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:test_dummy_secret_key_please_set_TOSS_SECRET_KEY}

kirin:
  expiration:
    fixed-delay: 60000
  image:
    upload-dir: ${IMAGE_UPLOAD_DIR:uploads/images}
    base-url: /api/images
