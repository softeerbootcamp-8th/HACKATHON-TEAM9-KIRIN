spring:
  application:
    name: superservice
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:kirin}
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

toss:
  payment:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:test_dummy_secret_key_please_set_TOSS_SECRET_KEY}

kirin:
  expiration:
    fixed-delay: 60000
